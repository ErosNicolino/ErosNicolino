<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-label="Eros Nicolino — Machine Learning e Dados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0816"/><stop offset="0.55" stop-color="#140d2a"/><stop offset="1" stop-color="#1d1040"/>
    </linearGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#d9ccfa"/><stop offset="1" stop-color="#9b7be8"/>
    </linearGradient>
    <linearGradient id="linha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7655b8" stop-opacity="0"/><stop offset="0.5" stop-color="#b79df6"/><stop offset="1" stop-color="#7655b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.4"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#2fd1c5" stop-opacity="0.16"/><stop offset="1" stop-color="#2fd1c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="cartao"><rect width="600" height="440" rx="26"/></clipPath>
    <clipPath id="c1"><rect x="76" y="262" height="44" width="0"><animate attributeName="width" values="0;0;440;440;0;0" keyTimes="0;0.02;0.14;0.28;0.32;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="76" y="262" height="44" width="0"><animate attributeName="width" values="0;0;0;360;360;0;0" keyTimes="0;0.33;0.35;0.46;0.6;0.64;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="76" y="262" height="44" width="0"><animate attributeName="width" values="0;0;0;460;460;0" keyTimes="0;0.65;0.67;0.8;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace; }
      .sobe { animation: sobe 0.9s ease-out both; }
      .d1 { animation-delay: 0.1s } .d2 { animation-delay: 0.35s } .d3 { animation-delay: 0.6s } .d4 { animation-delay: 0.85s }
      @keyframes sobe { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .p { animation: flutua 7s ease-in-out infinite }
      @keyframes flutua { 0%,100% { transform: translateY(0); opacity: .25 } 50% { transform: translateY(-12px); opacity: .9 } }
      .orb { animation: gira 26s linear infinite; transform-origin: 486px 96px }
      @keyframes gira { to { transform: rotate(360deg) } }
      .pulso { animation: pulso 3s ease-in-out infinite; transform-origin: 486px 96px }
      @keyframes pulso { 0%,100% { transform: scale(1) } 50% { transform: scale(1.1) } }
      .varre { animation: varre 4s ease-in-out infinite }
      @keyframes varre { 0% { transform: translateX(-300px) } 100% { transform: translateX(600px) } }
    </style>
  </defs>
  <g clip-path="url(#cartao)">
    <rect width="600" height="440" fill="url(#bg)"/>
    <rect width="600" height="440" fill="url(#grade)"/>
    <rect width="600" height="440" fill="url(#brilho)"/>
    <rect width="600" height="440" fill="url(#brilho2)"/>
    <g fill="#d9ccfa">
      <circle class="p" cx="60" cy="40" r="2" style="animation-delay:-1s"/>
      <circle class="p" cx="300" cy="30" r="1.6" style="animation-delay:-3s"/>
      <circle class="p" cx="540" cy="250" r="2" style="animation-delay:-5s"/>
      <circle class="p" cx="420" cy="400" r="1.8" style="animation-delay:-2s"/>
      <circle class="p" cx="200" cy="410" r="1.6" style="animation-delay:-4s"/>
      <circle class="p" cx="30" cy="300" r="1.6" style="animation-delay:-6s"/>
    </g>
    <circle cx="486" cy="96" r="62" fill="none" stroke="#7655b8" stroke-opacity="0.4" stroke-dasharray="3 8"/>
    <g class="orb">
      <circle cx="486" cy="34" r="5" fill="#b79df6"/><circle cx="548" cy="96" r="4" fill="#2fd1c5"/><circle cx="424" cy="96" r="4" fill="#9b7be8"/>
    </g>
    <g stroke="#b79df6" stroke-opacity="0.4" stroke-width="1.4">
      <line x1="464" y1="80" x2="508" y2="70"/><line x1="464" y1="80" x2="508" y2="122"/><line x1="464" y1="112" x2="508" y2="70"/><line x1="464" y1="112" x2="508" y2="122"/>
    </g>
    <g class="pulso">
      <circle cx="464" cy="80" r="8" fill="#1d1040" stroke="#b79df6" stroke-width="2"/><circle cx="464" cy="112" r="8" fill="#1d1040" stroke="#b79df6" stroke-width="2"/>
      <circle cx="508" cy="70" r="8" fill="#1d1040" stroke="#2fd1c5" stroke-width="2"/><circle cx="508" cy="122" r="8" fill="#1d1040" stroke="#2fd1c5" stroke-width="2"/>
    </g>

    <text x="52" y="92" class="m sobe d1" font-size="20" letter-spacing="4" fill="#b79df6">OLÁ! EU SOU</text>
    <text x="48" y="170" class="t sobe d2" font-size="74" font-weight="800" letter-spacing="-2" fill="url(#nome)">Eros</text>
    <text x="48" y="242" class="t sobe d2" font-size="74" font-weight="800" letter-spacing="-2" fill="url(#nome)">Nicolino</text>

    <g class="sobe d3">
      <text x="52" y="294" class="m" font-size="26" fill="#7655b8">&gt;</text>
      <text x="76" y="294" class="m" font-size="26" fill="#e9e2ff" clip-path="url(#c1)">ML Engineer</text>
      <text x="76" y="294" class="m" font-size="26" fill="#e9e2ff" clip-path="url(#c2)">Engenharia de Dados</text>
      <text x="76" y="294" class="m" font-size="26" fill="#e9e2ff" clip-path="url(#c3)">Sistemas em produção</text>
    </g>
    <g class="sobe d4">
      <rect x="52" y="330" width="420" height="2" fill="url(#linha)"/>
      <text x="52" y="368" class="m" font-size="21" fill="#a99bc9">Python · AWS · MLOps · C#</text>
      <text x="52" y="400" class="m" font-size="21" fill="#7d6fa3">São Paulo, Brasil</text>
    </g>
    <rect class="varre" x="0" y="0" width="220" height="2" fill="url(#linha)"/>
  </g>
  <rect x="1" y="1" width="598" height="438" rx="26" fill="none" stroke="#7655b8" stroke-opacity="0.55" stroke-width="2"/>
</svg>
