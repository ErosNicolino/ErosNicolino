<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Eros Nicolino — Machine Learning e Dados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0816"/>
      <stop offset="0.55" stop-color="#140d2a"/>
      <stop offset="1" stop-color="#1d1040"/>
    </linearGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d9ccfa"/>
      <stop offset="1" stop-color="#9b7be8"/>
    </linearGradient>
    <linearGradient id="linha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7655b8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b79df6"/>
      <stop offset="1" stop-color="#7655b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.82" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho2" cx="0.1" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#2fd1c5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2fd1c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="cartao"><rect width="1200" height="340" rx="22"/></clipPath>
    <clipPath id="c1"><rect x="96" y="196" height="40" width="0"><animate attributeName="width" values="0;0;440;440;0;0" keyTimes="0;0.02;0.14;0.28;0.32;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="96" y="196" height="40" width="0"><animate attributeName="width" values="0;0;0;360;360;0;0" keyTimes="0;0.33;0.35;0.46;0.6;0.64;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="96" y="196" height="40" width="0"><animate attributeName="width" values="0;0;0;520;520;0" keyTimes="0;0.65;0.67;0.8;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace; }
      .sobe { opacity: 0; animation: sobe 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.1s } .d2 { animation-delay: 0.35s } .d3 { animation-delay: 0.6s } .d4 { animation-delay: 0.85s }
      @keyframes sobe { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .pisca { animation: pisca 1s steps(1) infinite }
      @keyframes pisca { 50% { opacity: 0 } }
      .p { animation: flutua 7s ease-in-out infinite }
      @keyframes flutua { 0%,100% { transform: translateY(0); opacity: .25 } 50% { transform: translateY(-14px); opacity: .9 } }
      .orb { animation: gira 26s linear infinite; transform-origin: 980px 170px }
      @keyframes gira { to { transform: rotate(360deg) } }
      .orb2 { animation: gira2 18s linear infinite; transform-origin: 980px 170px }
      @keyframes gira2 { to { transform: rotate(-360deg) } }
      .pulso { animation: pulso 3s ease-in-out infinite; transform-origin: 980px 170px }
      @keyframes pulso { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.08); opacity: 1 } }
      .varre { animation: varre 4s ease-in-out infinite }
      @keyframes varre { 0% { transform: translateX(-420px) } 100% { transform: translateX(1200px) } }
    </style>
  </defs>

  <g clip-path="url(#cartao)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grade)"/>
    <rect width="1200" height="340" fill="url(#brilho)"/>
    <rect width="1200" height="340" fill="url(#brilho2)"/>

    <!-- particulas -->
    <g fill="#d9ccfa">
      <circle class="p" cx="120" cy="60" r="1.6" style="animation-delay:-1s"/>
      <circle class="p" cx="260" cy="300" r="1.2" style="animation-delay:-3s"/>
      <circle class="p" cx="420" cy="40" r="1.4" style="animation-delay:-5s"/>
      <circle class="p" cx="610" cy="290" r="1.8" style="animation-delay:-2s"/>
      <circle class="p" cx="700" cy="70" r="1.2" style="animation-delay:-4s"/>
      <circle class="p" cx="820" cy="310" r="1.5" style="animation-delay:-6s"/>
      <circle class="p" cx="1130" cy="60" r="1.6" style="animation-delay:-1.5s"/>
      <circle class="p" cx="1160" cy="280" r="1.2" style="animation-delay:-3.5s"/>
      <circle class="p" cx="560" cy="150" r="1" style="animation-delay:-2.5s"/>
      <circle class="p" cx="40" cy="220" r="1.3" style="animation-delay:-4.5s"/>
    </g>

    <!-- rede neural / orbita -->
    <g opacity="0.95">
      <circle cx="980" cy="170" r="118" fill="none" stroke="#7655b8" stroke-opacity="0.35" stroke-dasharray="3 9"/>
      <circle cx="980" cy="170" r="82" fill="none" stroke="#b79df6" stroke-opacity="0.25"/>
      <g class="orb">
        <circle cx="980" cy="52" r="6" fill="#b79df6"/>
        <circle cx="1098" cy="170" r="4" fill="#2fd1c5"/>
        <circle cx="862" cy="170" r="4.5" fill="#9b7be8"/>
        <circle cx="980" cy="288" r="3.5" fill="#d9ccfa"/>
      </g>
      <g class="orb2">
        <circle cx="1038" cy="112" r="4" fill="#2fd1c5"/>
        <circle cx="922" cy="228" r="4" fill="#b79df6"/>
        <circle cx="922" cy="112" r="3" fill="#d9ccfa"/>
      </g>
      <g stroke="#b79df6" stroke-opacity="0.35" stroke-width="1.2">
        <line x1="940" y1="140" x2="1020" y2="125"/><line x1="940" y1="140" x2="1020" y2="170"/><line x1="940" y1="140" x2="1020" y2="215"/>
        <line x1="940" y1="200" x2="1020" y2="125"/><line x1="940" y1="200" x2="1020" y2="170"/><line x1="940" y1="200" x2="1020" y2="215"/>
      </g>
      <g class="pulso">
        <circle cx="940" cy="140" r="9" fill="#1d1040" stroke="#b79df6" stroke-width="2"/>
        <circle cx="940" cy="200" r="9" fill="#1d1040" stroke="#b79df6" stroke-width="2"/>
        <circle cx="1020" cy="125" r="9" fill="#1d1040" stroke="#2fd1c5" stroke-width="2"/>
        <circle cx="1020" cy="170" r="9" fill="#1d1040" stroke="#2fd1c5" stroke-width="2"/>
        <circle cx="1020" cy="215" r="9" fill="#1d1040" stroke="#2fd1c5" stroke-width="2"/>
      </g>
    </g>

    <!-- textos -->
    <text x="96" y="92" class="t m sobe d1" font-size="15" letter-spacing="4" fill="#b79df6">OLÁ! EU SOU</text>
    <text x="92" y="160" class="t sobe d2" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#nome)">Eros Nicolino</text>

    <g class="sobe d3">
      <text x="96" y="225" class="m" font-size="26" fill="#7655b8">&gt;</text>
      <g transform="translate(26 0)">
        <text x="96" y="225" class="m" font-size="26" fill="#e9e2ff" clip-path="url(#c1)">Machine Learning Engineer</text>
        <text x="96" y="225" class="m" font-size="26" fill="#e9e2ff" clip-path="url(#c2)">Engenharia de Dados</text>
        <text x="96" y="225" class="m" font-size="26" fill="#e9e2ff" clip-path="url(#c3)">Sistemas em produção de verdade</text>
      </g>
    </g>

    <g class="sobe d4">
      <rect x="96" y="262" width="430" height="1.5" fill="url(#linha)"/>
      <text x="96" y="294" class="m" font-size="14" fill="#a99bc9">Python · AWS · MLOps · C# · São Paulo, Brasil</text>
    </g>

    <!-- faixa de luz -->
    <rect class="varre" x="0" y="0" width="300" height="2" fill="url(#linha)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="none" stroke="#7655b8" stroke-opacity="0.55" stroke-width="1.5"/>
</svg>
